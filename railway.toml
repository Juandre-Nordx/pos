
[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[deploy.env]
ENVIRONMENT = "production"
DEFAULT_CURRENCY = "ZAR"
DEFAULT_LOCALE = "en-ZA"
DEFAULT_TIMEZONE = "Africa/Johannesburg"
CORS_ORIGINS = "http://localhost:5173,https://pos-frontend-production.up.railway.app,https://pos-forntend-production.up.railway.app"
CORS_ORIGIN_REGEX = "https://pos-(?:frontend|forntend)-production\\.up\\.railway\\.app"
VITE_API_URL = "https://pos-production-62cf5.up.railway.app/api/v1"
